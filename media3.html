<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Media Viewer</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html,body{
      width:100%;
      height:100%;
      background:#000;
      overflow:hidden;
      font-family:sans-serif;
    }

    body{
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
    }

    img,
    video,
    iframe{
      width:100%;
      height:100%;
      border:none;
      background:#000;
      object-fit:contain;
    }

    #msg{
      color:#fff;
      font-size:22px;
      font-weight:600;
      text-align:center;
      padding:20px;
    }

    #downloadBtn{
      position:fixed;
      top:12px;
      right:12px;
      z-index:9999;
      border:none;
      outline:none;
      padding:12px 16px;
      border-radius:12px;
      background:#0088ff;
      color:#fff;
      font-size:15px;
      font-weight:700;
      cursor:pointer;
      box-shadow:0 0 10px rgba(0,0,0,.4);
      display:none;
    }

    #progressBox{
      position:fixed;
      top:62px;
      right:12px;
      z-index:9999;
      width:220px;
      background:#111;
      border-radius:12px;
      overflow:hidden;
      display:none;
      border:1px solid #333;
    }

    #progressText{
      color:#fff;
      padding:8px;
      font-size:13px;
      text-align:center;
    }

    #progressBar{
      height:6px;
      width:0%;
      background:#00aaff;
      transition:width .2s linear;
    }
  </style>
</head>
<body>

<div id="msg">Loading...</div>

<button id="downloadBtn">Download</button>

<div id="progressBox">
  <div id="progressText">0%</div>
  <div id="progressBar"></div>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script>

const downloadBtn = document.getElementById("downloadBtn");
const progressBox = document.getElementById("progressBox");
const progressText = document.getElementById("progressText");
const progressBar = document.getElementById("progressBar");
  

const tg = window.Telegram?.WebApp;

let startParam = null;
let telegramUser = null;

if (tg && tg.initDataUnsafe) {

  tg.ready();

  startParam = tg.initDataUnsafe?.start_param;

  telegramUser = tg.initDataUnsafe?.user;

  console.log("TG USER:", telegramUser);

  if(telegramUser?.id){

    console.log("USER ID:", telegramUser.id);

    fetch(
      `https://script.google.com/macros/s/AKfycbxE_Bbx2dDbsbONMyjRAPzg4FBSf4wn1krXxIZZBa-sJADRvBkdMWpPnavWv7Zrd3S4/exec?action=1&uid=${telegramUser.id}`
    )
    .then(r=>r.json())
    .then(d=>{

      console.log("FETCH RESPONSE:", d);

      if(d.ok === true){
        console.log("OK TRUE");
        downloadBtn.style.display="block";
      }else{
        downloadBtn.style.display="none";
      }

    })
    .catch(err=>{
      console.error("FETCH ERROR:", err);
    });

  }

}

// fallback for browser
const params = new URLSearchParams(location.search);

let mediaUrl = params.get("url");

let aldl = params.get("download") || "0";

let allowDownload = aldl !== "0";

let forceIframe = params.get("iframe") === "1";

// telegram start params
const slug = startParam || params.get("startapp") || params.get("start");

let jsdeliver = null;

if(slug){

  console.log("START SLUG:", slug);

  var [r,p,s] = slug.split("_");

  var paths = {
    v:"vExample",
    t:"thumbs"
  };

  mediaUrl =
    `https://raw.githubusercontent.com/VLM-LK/VLM-GH-BOT${r}/main/${paths[p]}/${s}.${p=="t"?"jpg":"css"}`;

  jsdeliver =
    `https://cdn.jsdelivr.net/gh/VLM-LK/VLM-GH-BOT${r}@main/${paths[p]}/${s}.${p=="t"?"jpg":"css"}`;
}


if(!mediaUrl){

  document.body.innerHTML = `<div id="msg">No Media!<br>${slug}</div>`;

} else {

  const cleanUrl = decodeURIComponent(mediaUrl);

  const cleanJsDUrl = jsdeliver
    ? decodeURIComponent(jsdeliver)
    : cleanUrl;

  const lower = cleanUrl.toLowerCase();

  const videoExts = [".mp4",".webm",".mkv",".mov",".m3u8",".css"];

  const imageExts = [
    ".jpg",".jpeg",".png",".gif",
    ".webp",".bmp",".svg",".txt"
  ];

  const isVideo = videoExts.some(v => lower.includes(v));

  const isImage = imageExts.some(v => lower.includes(v));

  document.getElementById("msg")?.remove();

  // DOWNLOAD BUTTON
  downloadBtn.onclick = async ()=>{

    try{

      progressBox.style.display = "block";

      const res = await fetch(cleanJsDUrl);

      const total = +res.headers.get("Content-Length") || 0;

      const reader = res.body.getReader();

      let received = 0;

      let chunks = [];

      while(true){

        const {done,value} = await reader.read();

        if(done) break;

        chunks.push(value);

        received += value.length;

        if(total){

          const percent = Math.floor((received/total)*100);

          progressBar.style.width = percent + "%";

          progressText.innerText =
            percent + "% (" +
            Math.floor(received/1024/1024) +
            "MB)";
        }

      }

      const blob = new Blob(chunks);

      const url = URL.createObjectURL(blob);

      const a = document.createElement("a");

      a.href = url;

      if(isVideo){

        a.download = "video.mp4";

      } else if(isImage){

        a.download = "image.jpg";

      } else {

        a.download = "file";
      }

      document.body.appendChild(a);

      a.click();

      a.remove();

      URL.revokeObjectURL(url);

      progressText.innerText = "Completed";

      setTimeout(()=>{
        progressBox.style.display = "none";
      },1500);

    }catch(err){

      console.error(err);

      progressText.innerText = "Download Failed";
    }

  };

  // FORCE IFRAME
  if(forceIframe){

    const iframe = document.createElement("iframe");

    iframe.src = cleanUrl;

    iframe.allowFullscreen = true;

    document.body.appendChild(iframe);

  }

  // VIDEO
  else if(isVideo){

    const video = document.createElement("video");

    video.src = cleanJsDUrl;

    video.poster = cleanUrl
      .replace("vExample","thumbs")
      .replace(".css",".jpg");

    video.controls = true;

    video.autoplay = true;

    video.playsInline = true;

    video.onerror = ()=>{

      if(jsdeliver){

        video.src = cleanUrl;
      }
    };

    if(!allowDownload){

      video.controlsList = "nodownload";
    }

    document.body.appendChild(video);

  }

  // IMAGE
  else if(isImage){

    const img = document.createElement("img");

    img.src = cleanJsDUrl;

    img.onerror = ()=>{
      img.src = cleanUrl;
    };

    if(!allowDownload){

      img.oncontextmenu = e => e.preventDefault();

      img.draggable = false;
    }

    document.body.appendChild(img);

  }

  // OTHER
  else {

    const iframe = document.createElement("iframe");

    iframe.src = cleanUrl;

    iframe.allowFullscreen = true;

    document.body.appendChild(iframe);
  }
}

</script>

</body>
  </html>
