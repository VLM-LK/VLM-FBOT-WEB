<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Media Viewer</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html,body{
      width:100%;
      height:100%;
      background:#000;
      overflow:hidden;
      font-family:sans-serif;
    }

    body{
      display:flex;
      align-items:center;
      justify-content:center;
    }

    img,
    video,
    iframe{
      width:100%;
      height:100%;
      border:none;
      background:#000;
      object-fit:contain;
    }

    #msg{
      color:#fff;
      font-size:22px;
      font-weight:600;
    }
  </style>
</head>
<body>

<div id="msg">Loading...</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script>
const tg = window.Telegram?.WebApp;

// get start param from Telegram
let startParam = null;

if (tg && tg.initDataUnsafe) {
  tg.ready();
  startParam = tg.initDataUnsafe?.start_param;
}

// fallback for normal browser URL
const params = new URLSearchParams(location.search); 
let mediaUrl = params.get("url");
let allowDownload = params.get("download") !== "0";
let forceIframe = params.get("iframe") === "1";

// if opened via Telegram like ?startapp=abc123
const slug = startParam || params.get("startapp") || params.get("start");

if(slug){
  console.log("START SLUG:", slug);
  var [r,p,s] = slug.split("_");
  // you can map slug → real media url here
  var paths={
    v:"vExample",
    t:"thumb"
  };
  mediaUrl = `https://vlm-lk.github.io/VLM-GH-BOT${r}/${paths[p]}/${s}`;
}

if(!mediaUrl){

  document.body.innerHTML = `<div id="msg">No Media!<br>${slug}</div>`;

} else {

  const cleanUrl = decodeURIComponent(mediaUrl);
  const lower = cleanUrl.toLowerCase();

  const videoExts = [".mp4",".webm",".mkv",".mov",".m3u8",".css"];
  const imageExts = [".jpg",".jpeg",".png",".gif",".webp",".bmp",".svg",".txt"];

  const isVideo = videoExts.some(v => lower.includes(v));
  const isImage = imageExts.some(v => lower.includes(v));

  document.body.innerHTML = "";

  if(forceIframe){

    const iframe = document.createElement("iframe");
    iframe.src = cleanUrl;
    iframe.allowFullscreen = true;
    document.body.appendChild(iframe);

  } else if(isVideo){

    const video = document.createElement("video");
    video.src = cleanUrl;
    video.controls = true;
    video.autoplay = true;
    video.playsInline = true;

    if(!allowDownload){
      video.controlsList = "nodownload";
    }

    document.body.appendChild(video);

  } else if(isImage){

    const img = document.createElement("img");
    img.src = cleanUrl;

    if(!allowDownload){
      img.oncontextmenu = e => e.preventDefault();
      img.draggable = false;
    }

    document.body.appendChild(img);

  } else {

    const iframe = document.createElement("iframe");
    iframe.src = cleanUrl;
    iframe.allowFullscreen = true;
    document.body.appendChild(iframe);

  }
}
</script>


</body>
  </html>
