<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>VLM Media</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  background: black;
  overflow: hidden;
}

/* ALWAYS FULL SCREEN */
body {
  display: flex;
  align-items: center;
  justify-content: center;
  padding-top: env(safe-area-inset-top, 80px);
  padding-bottom: env(safe-area-inset-bottom, 80px);
}

/* WRAPPER */
#app {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* MEDIA */
video, img, iframe {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: black;
  border: none;
}

/* IMMERSIVE MODE */
.immersive {
  padding: 0 !important;
}

/* FLOATING BUTTON */
#fsBtn {
  position: fixed;
  bottom: 18px;
  right: 18px;
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: rgba(255,255,255,0.12);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.2);
  color: white;
  font-size: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  cursor: pointer;
}
</style>
</head>

<body>

<div id="app"></div>
<div id="fsBtn">⛶</div>

<script>
const tg = window.Telegram?.WebApp;

if (tg && tg.initDataUnsafe) {
  tg.ready();
  tg.expand();
  tg.disableVerticalSwipes?.();
}

/* URL + TELEGRAM PARAMS */
const params = new URLSearchParams(location.search);

// normal url mode
let mediaUrl = params.get("url");

// telegram startapp mode
const telegramSlug = tg?.initDataUnsafe?.start_param || params.get("startapp");

/* resolve slug */
if (telegramSlug) {
  mediaUrl = `https://vlm-lk.github.io/VLM-FBOT-WEB/${telegramSlug}`;
}

/* APP ROOT */
const app = document.getElementById("app");

/* LOAD MEDIA */
function loadMedia(url) {

  if (!url) {
    app.innerHTML = `<div style="color:white">No Media!</div>`;
    return;
  }

  app.innerHTML = "";

  const lower = url.toLowerCase();

  const videoExts = [".mp4",".webm",".mkv",".mov",".m3u8"];
  const imageExts = [".jpg",".jpeg",".png",".gif",".webp",".svg"];

  const isVideo = videoExts.some(v => lower.includes(v));
  const isImage = imageExts.some(v => lower.includes(v));

  let el;

  if (isVideo) {

    el = document.createElement("video");
    el.src = url;
    el.controls = true;
    el.autoplay = true;
    el.playsInline = true;
    el.controlsList = "nodownload noplaybackrate noremoteplayback";

  } else if (isImage) {

    el = document.createElement("img");
    el.src = url;

  } else {

    el = document.createElement("iframe");
    el.src = url;
    el.allowFullscreen = false;
  }

  app.appendChild(el);
}

/* INIT */
loadMedia(mediaUrl);

/* IMMERSIVE BUTTON */
let immersive = false;

document.getElementById("fsBtn").onclick = () => {

  immersive = !immersive;

  if (immersive) {
    document.body.classList.add("immersive");
    tg?.expand();
  } else {
    document.body.classList.remove("immersive");
    tg?.expand();
  }
};
</script>

</body>
</html>
